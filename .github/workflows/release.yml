name: Release to R2

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

# Security: keep the secret out of job-level env so it is only exposed
# to steps that need it. The boolean flag gates the `if:` checks below.
env:
  HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}

permissions:
  contents: write

# Serialize runs for the same release target: back-to-back pushes of the same
# tag must not race the channel manifest write (latest.json etc.). Different
# tags run in parallel; a run is never cancelled mid-release.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version-guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify package.json version matches tag
        id: extract
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($GITHUB_REF_NAME). Bump package.json before tagging."
            exit 1
          fi
          echo "→ package.json version matches tag: ${VERSION}"

  test:
    needs: version-guard
    runs-on: ubuntu-latest
    # Split the engine test suite across parallel shards (Vitest --shard).
    # Each shard runs a disjoint subset of bench/**/*.test.ts; the whole suite
    # is only "green" when every shard passes. Run on the canary Bun runtime
    # so the engine tests exercise the same runtime that ships with the agent.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install

      - name: Generate embedded sqlite-vec extension
        run: bun run scripts/generate-vec-embed.ts linux x64

      - name: Run lint
        run: bun run lint

      - name: Run tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: bun run test -- --shard=${{ matrix.shard }}/${{ matrix.total }}

  build-bundles:
    needs: [version-guard, test]
    env:
      VERSION: ${{ needs.version-guard.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform-key: linux-x64
          - os: ubuntu-24.04-arm
            platform-key: linux-arm64
          - os: macos-15-intel
            platform-key: darwin-x64
          - os: macos-latest
            platform-key: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Deliberate pin on the canary line: engines.bun requires bun >=
          # 1.4.0-canary.1 and the newest stable release (1.3.14) predates that
          # floor. Bun publishes canary builds only under the moving `canary`
          # tag (no immutable per-build artifact), so this is the tightest pin
          # that installs; switch to a stable version here (one-line change)
          # once a stable release satisfies the floor.
          bun-version: canary

      - name: Install dependencies
        run: bun install

      - name: Build bundle
        run: bun run scripts/build-bundle.ts

      - name: List bundle artifacts
        run: ls -lh beam-v*.tar.gz*

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.platform-key }}
          path: |
            beam-v*.tar.gz
            beam-v*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [version-guard, test, build-bundles]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version-guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set CHANNEL
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-beta* ]]; then
            echo "CHANNEL=beta" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF_NAME}" == *-dev* ]]; then
            echo "CHANNEL=dev" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Anchored regex, NOT a glob: v1.2.3-rc.1 matches v*.*.* but is a
            # prerelease — it must fail here, never fall through to stable and
            # overwrite latest.json with a prerelease build.
            echo "CHANNEL=stable" >> "$GITHUB_ENV"
          else
            echo "::error::unsupported prerelease tag '${GITHUB_REF_NAME}'; use vX.Y.Z-beta.N or vX.Y.Z-dev.N"
            exit 1
          fi
          echo "→ VERSION=${VERSION} CHANNEL=${CHANNEL}"

      - name: Sync package.json version
        run: |
          node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');"
          echo "→ package.json version set to ${VERSION}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Deliberate pin on the canary line: engines.bun requires bun >=
          # 1.4.0-canary.1 and the newest stable release (1.3.14) predates that
          # floor. Bun publishes canary builds only under the moving `canary`
          # tag (no immutable per-build artifact), so this is the tightest pin
          # that installs; switch to a stable version here (one-line change)
          # once a stable release satisfies the floor.
          bun-version: canary

      - name: Install dependencies
        run: bun install

      - name: Download bundle artifacts
        uses: actions/download-artifact@v8
        with:
          path: bundles
          pattern: bundle-*
          merge-multiple: false

      - name: Generate embedded sqlite-vec extension
        run: bun run scripts/generate-vec-embed.ts linux x64

      - name: Build source tarball
        run: |
          TARBALL_NAME="beam-v${VERSION}.tar.gz"
          echo "Building ${TARBALL_NAME}"
          mkdir -p /tmp/beam-release
          tar -czf "/tmp/beam-release/${TARBALL_NAME}" \
            --warning=no-file-changed \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=bundles \
            --exclude=engine/sqlite-vec-embedded.ts \
            --exclude=.git \
            --exclude=*.db \
            --exclude=*.db-journal \
            --exclude=*.db-wal \
            --exclude=*.db-shm \
            --exclude=logs \
            --exclude=.env \
            --exclude=.env.* \
            --exclude=bench/tmp-audit \
            --exclude=.wrangler \
            --exclude=cloudflare/.wrangler \
            --exclude=.omo \
            --exclude=.rtk \
            --exclude=.opencode \
            .
          cp "/tmp/beam-release/${TARBALL_NAME}" "./${TARBALL_NAME}"
          ls -lh "${TARBALL_NAME}"

      - name: Generate SHA-256 for source tarball
        run: |
          TARBALL_NAME="beam-v${VERSION}.tar.gz"
          sha256sum "${TARBALL_NAME}" > "${TARBALL_NAME}.sha256"
          cat "${TARBALL_NAME}.sha256"

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp "beam-v${VERSION}.tar.gz" release-assets/
          cp "beam-v${VERSION}.tar.gz.sha256" release-assets/
          for dir in bundles/bundle-*/; do
            if [ -d "$dir" ]; then
              cp "$dir"/*.tar.gz release-assets/ 2>/dev/null || true
              cp "$dir"/*.tar.gz.sha256 release-assets/ 2>/dev/null || true
            fi
          done
          ls -lh release-assets/

      - name: Generate release manifest
        env:
          R2_BASE_URL: https://pub-2f55c98709e74d1d900b89ec20f8f1fc.r2.dev
          REQUIRE_ALL_BUNDLES: "true"
        run: |
          cd release-assets
          bun run ../scripts/generate-release-manifest.ts
          cd ..
          cp "release-assets/manifest.json" "manifest.json"
          cat manifest.json

      - name: Verify release manifest completeness
        run: |
          BUNDLE_COUNT=$(jq -e '.bundles | length' manifest.json) || { echo "::error::could not read bundle count from manifest"; exit 1; }
          # Fail closed: a non-numeric count (jq error, missing key) must not
          # pass the -lt comparison below, or the gate would silently succeed.
          case "$BUNDLE_COUNT" in
            *[!0-9]*|'') echo "::error::bundle count is not numeric: '${BUNDLE_COUNT}'"; exit 1 ;;
          esac
          if [ "$BUNDLE_COUNT" -lt 4 ]; then
            echo "::error::Manifest has only ${BUNDLE_COUNT} platform bundles; expected 4"
            jq '.bundles | keys' manifest.json
            exit 1
          fi
          echo "✓ Manifest has ${BUNDLE_COUNT} platform bundles"

      - name: Sign tarballs, checksums and manifest (GPG, optional)
        if: env.HAS_GPG_KEY == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --import
          # Sign everything a consumer needs to verify: each tarball, each
          # .sha256 checksum, and the manifest itself. Consumers must verify
          # the matching .asc files.
          for f in \
            "release-assets/beam-v${VERSION}.tar.gz" \
            "release-assets/beam-v${VERSION}.tar.gz.sha256" \
            "release-assets/beam-v${VERSION}"-*.tar.gz \
            "release-assets/beam-v${VERSION}"-*.tar.gz.sha256 \
            "release-assets/manifest.json"; do
            [ -e "$f" ] || continue
            gpg --batch --yes --armor --detach-sign "$f"
          done

      - name: Upload source tarball to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put "beam-backups/releases/v${VERSION}/beam-v${VERSION}.tar.gz" --file "beam-v${VERSION}.tar.gz" --remote

      - name: Upload source SHA-256 to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put "beam-backups/releases/v${VERSION}/beam-v${VERSION}.tar.gz.sha256" --file "beam-v${VERSION}.tar.gz.sha256" --remote

      - name: Upload bundle tarballs to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in "release-assets/beam-v${VERSION}"-*.tar.gz; do
            [ -e "$f" ] || continue
            npx wrangler r2 object put "beam-backups/releases/v${VERSION}/$(basename "$f")" --file "$f" --remote
          done

      - name: Upload bundle SHA-256 checksums to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in "release-assets/beam-v${VERSION}"-*.tar.gz.sha256; do
            [ -e "$f" ] || continue
            npx wrangler r2 object put "beam-backups/releases/v${VERSION}/$(basename "$f")" --file "$f" --remote
          done

      - name: Upload GPG signatures to R2
        if: env.HAS_GPG_KEY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Every .asc (tarballs, checksums, manifest) is uploaded alongside
          # its target so consumers can verify each artifact's signature.
          for f in "release-assets/"*.asc; do
            [ -e "$f" ] || continue
            npx wrangler r2 object put "beam-backups/releases/v${VERSION}/$(basename "$f")" --file "$f" --remote
          done

      - name: Upload manifest to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "${CHANNEL}" in
            stable)
              MANIFEST_PATH="beam-backups/releases/latest.json"
              ;;
            beta)
              MANIFEST_PATH="beam-backups/releases/channel/beta.json"
              ;;
            dev)
              MANIFEST_PATH="beam-backups/releases/channel/dev.json"
              ;;
            *)
              echo "Unknown channel: ${CHANNEL}"
              exit 1
              ;;
          esac
          npx wrangler r2 object put "${MANIFEST_PATH}" --file manifest.json --remote

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Release ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag \
              release-assets/*
          fi
