name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

# Read-only token: the build job needs no write scope (checkout uses
# persist-credentials: false below), and a compromised step must not be able
# to push or mutate releases.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test
      ANTHROPIC_API_KEY: test-anthropic-key
      ROBINHOOD_RPC_URL: https://example.com
      
      # A syntactically VALID EVM key so the full-stack smoke test
      # (program.test.ts "buildLayer provides all services") boots the adapter.
      # The adapter fail-closes on an unparseable key, so an invalid string
      # here fails the whole suite. This is a throwaway test key, not a secret.
      # Quoted so YAML doesn't parse the 0x… prefix as a hex integer.
      WALLET_PRIVATE_KEY: '0xabababababababababababababababababababababababababababababababab'
      LOG_LEVEL: error
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pin the CI runtime to the repository-supported stable Bun release.
          bun-version: 1.4.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate embedded sqlite-vec extension
        run: bun run scripts/generate-vec-embed.ts linux x64

      - name: Type check
        run: bun run lint

      - name: Build
        run: bun run build

      # Smoke-test the shell wrapper (the package `bin` and primary user entry
      # point). `bash -n` catches quoting/unbound-variable regressions and the
      # version invocation proves it resolves bun and launches the CLI — the
      # wrapper was previously excluded from every lint/format/test gate. The
      # HOME-unset run executes the wrapper to prove the PATH-based bun lookup
      # works without a home directory (systemd units, cron, minimal images).
      - name: Smoke test scripts/beam.sh
        run: |
          bash -n scripts/beam.sh
          scripts/beam.sh --version
          env -u HOME PATH="$PATH" scripts/beam.sh --version

      # Coverage was local-only; this also enforces the istanbul thresholds
      # configured in vitest.config.ts so PRs can't silently regress them.
      - name: Run tests with coverage gate
        run: bun run coverage
